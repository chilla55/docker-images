# ============================================================================
# Docker Swarm Stack for Pelican Panel
# ============================================================================
# Deploy: docker stack deploy -c docker-compose.swarm.yml pelican
# ============================================================================

version: "3.8"

networks:
  web-net:
    external: true

  mariadb-net:
    external: true

  redis-net:
    external: true

secrets:
  panel_app_key:
    external: true
    name: pelican_app_key

  panel_db_password:
    external: true
    name: pelican_db_password

  panel_mail_password:
    external: true
    name: vaultwarden_smtp_password

configs:
  php_ini_custom:
    file: ./php-custom.ini

volumes:
  pelican-data:

x-common:
  panel: &panel-environment
    APP_URL: https://panel.chilla55.de
    LE_EMAIL: noreply@chilla55.de
    APP_DEBUG: "false"
    APP_ENV: production
    BEHIND_PROXY: "true"
    TRUSTED_PROXIES: "*"
    APP_TIMEZONE: Europe/Berlin
    APP_LOCALE: en
    XDG_DATA_HOME: /pelican-data
    SKIP_CADDY: "false"

  mail: &mail-environment
    MAIL_DRIVER: smtp
    MAIL_HOST: mail.chilla55.de
    MAIL_PORT: "465"
    MAIL_FROM: noreply@chilla55.de
    MAIL_USERNAME: noreply@chilla55.de
    MAIL_SCHEME: smtps

  runtime: &runtime-environment
    CACHE_DRIVER: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    SESSION_SECURE_COOKIE: "true"

    DB_CONNECTION: mysql
    DB_HOST: mariadb
    DB_PORT: "3306"
    DB_DATABASE: pelican
    DB_USERNAME: pelican

    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ""

  registry: &registry-environment
    REGISTRY_HOST: proxy
    REGISTRY_PORT: "81"
    SERVICE_NAME: pelican
    DOMAINS: panel.chilla55.de
    ROUTE_PATH: /
    PORT: "80"
    REGISTRY_LOCAL_HEALTH_URL: http://127.0.0.1:80/
    REGISTRY_PROXY_HEALTH_PATH: /
    REGISTRY_PROXY_HEALTH_INTERVAL: 30s
    REGISTRY_PROXY_HEALTH_TIMEOUT: 5s

services:
  panel:
    image: ghcr.io/chilla55/pelican-panel:latest
    hostname: pelican-panel

    networks:
      - web-net
      - mariadb-net
      - redis-net

    environment:
      <<: [*panel-environment, *mail-environment, *runtime-environment, *registry-environment]

    secrets:
      - source: panel_app_key
        target: APP_KEY
      - source: panel_db_password
        target: DB_PASSWORD
      - source: panel_mail_password
        target: MAIL_PASSWORD

    configs:
      - source: php_ini_custom
        target: /usr/local/etc/php/conf.d/99-custom.ini
        mode: 0444

    volumes:
      - pelican-data:/pelican-data

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.web.node == web
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 300s
      labels:
        - "com.pelican.service=panel"

    stop_grace_period: 60s
